name: vertx
description: VERTX — Vertical Streaming Platform for Kenya
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.3
  retrofit: ^4.1.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Video player - media_kit supports HLS on Linux, Android, iOS, Web
  media_kit: ^1.1.10
  media_kit_video: ^1.2.6
  media_kit_libs_video: ^1.0.4

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_svg: ^2.0.10+1

  # Fonts
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.20.2
  timeago: ^3.6.1
  url_launcher: ^6.2.6
  package_info_plus: ^9.0.0

  # M-Pesa / Payments
  webview_flutter: ^4.7.0
  wakelock_plus: ^1.4.0
  media_kit_native_event_loop: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  retrofit_generator: ^8.1.0
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/fonts/

